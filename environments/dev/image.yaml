# environments/dev/image.yaml — the only field this Application source contributes (see
# ../../apps/dev-app.yaml): helm/ai-platform/values.yaml in polaris-ai-platform deliberately has
# no default image.tag (ADR-19), so Argo CD supplies it from here instead of a human running
# `helm --set image.tag=...` by hand.
#
# This is a placeholder — nothing has bumped it yet. An empty tag makes the chart's own
# `required` guard in templates/deployment.yaml refuse to render, the same fail-fast behaviour as
# every other environment before its first real deploy, rather than silently deploying nothing or
# "latest". Write real values here with, from a polaris-ai-platform checkout:
#   make gitops-bump-dev [GITOPS_DIR=/path/to/this/checkout] [ARGS=--push]
image:
  repository: ""
  tag: ""
